name: Lighthouse

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Lighthouse CI
        id: lhci
        continue-on-error: true
        run: |
          npm install -g @lhci/cli@0.14.x
          lhci autorun --config=./lighthouserc.json | tee lhci-output.txt

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: |
            .lighthouseci/
            lhci-output.txt
          retention-days: 30

      - name: Build PR summary
        if: always()
        id: summary
        run: |
          node scripts/lighthouse-summary.cjs > lh-summary.md || echo "No se pudo generar el resumen de Lighthouse." > lh-summary.md
          cat lh-summary.md >> "$GITHUB_STEP_SUMMARY"
          if grep -q '⚠️' lh-summary.md || [ "${{ steps.lhci.outcome }}" != "success" ]; then
            echo "should_comment=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_comment=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment on PR when below target
        if: always() && github.event_name == 'pull_request' && steps.summary.outputs.should_comment == 'true'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-path: lh-summary.md

      - name: Fail when below target
        if: steps.lhci.outcome != 'success'
        run: exit 1
