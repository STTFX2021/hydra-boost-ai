name: HydrAI redesign gate

on:
  pull_request:
    branches:
      - ci/hydrailabs-redesign-gate-20260716

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Preserve routes, contact wiring and demos
        run: npm run test:preservation

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
